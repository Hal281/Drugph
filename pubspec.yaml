name: drug_dosage_calculator
description: >
  Deterministic Drug Dosage Calculator Engine for Flutter Mobile.
  All dose calculations use fixed mathematical formulas — NO AI/LLM inference.
  Educational SaMD prototype — designed for traceability.
  DO NOT use clinically without medical validation.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  intl: ^0.20.3
  pdf: ^3.11.0
  printing: ^5.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  lints: ^4.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/data/
    - assets/data/high_alert_lists/
    - assets/evidence/

  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
    - family: ThaiFont
      fonts:
        - asset: assets/fonts/ThaiFont.ttf
    - family: Sarabun
      fonts:
        - asset: assets/fonts/ThaiFont.ttf

